# Rollback Gate as a composite GitHub Action: runs the gate, writes the job summary, keeps one sticky PR comment, signs the report on push, sets the check.
name: Rollback Gate
description: Can the last release's code still run on the database this pull request's Prisma migrations leave?

inputs:
  target:
    description: Branch whose newest release tag is base. Defaults to the pull request's base branch.
    required: false
    default: ""
  tag-pattern:
    description: Release tags to look for.
    required: false
    default: "v*"
  schema:
    description: The Prisma schema file, repo-relative.
    required: false
    default: prisma/schema.prisma
  migrations:
    description: The Prisma migrations folder, repo-relative.
    required: false
    default: prisma/migrations
  fail-on:
    description: '"unsafe" (default) or "risky": the lowest verdict that fails the check.'
    required: false
    default: unsafe
  comment:
    description: '"true" to keep one sticky comment on the pull request (never on forks, whose token is read-only).'
    required: false
    default: "true"
  github-token:
    description: Token for the PR comment; needs pull-requests write.
    required: false
    default: ${{ github.token }}
  sign:
    description: '"true" to sign the JSON report with cosign (keyless) on push events and upload it with its bundle; needs id-token write.'
    required: false
    default: "false"
  artifact-name:
    description: Name of the uploaded artifact holding the signed report.
    required: false
    default: rollback-gate-report

outputs:
  verdict:
    description: SAFE, RISKY or UNSAFE; empty if the gate itself failed.
    value: ${{ steps.gate.outputs.verdict }}
  exit-code:
    description: 0 SAFE/RISKY, 1 UNSAFE (or RISKY with fail-on risky), 2 the tool failed.
    value: ${{ steps.gate.outputs.exit-code }}
  report:
    description: Path of the JSON report; empty if the gate itself failed.
    value: ${{ steps.gate.outputs.json }}
  bundle:
    description: Path of the cosign bundle (signature, certificate, log entry); empty if not signed.
    value: ${{ steps.sign.outputs.bundle }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ github.action_path }}/.nvmrc

    # The action's own copy has source, not dist/: build it at the exact tag being used.
    - name: Build Rollback Gate
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build

    # Inputs reach the script as environment variables, never pasted into the script text,
    # so a branch name can't inject shell commands.
    - name: Run Rollback Gate
      id: gate
      shell: bash
      env:
        GATE_TARGET: ${{ inputs.target || github.base_ref }}
        GATE_TAG_PATTERN: ${{ inputs.tag-pattern }}
        GATE_SCHEMA: ${{ inputs.schema }}
        GATE_MIGRATIONS: ${{ inputs.migrations }}
        GATE_FAIL_ON: ${{ inputs.fail-on }}
      run: '"$GITHUB_ACTION_PATH/action/run-gate.sh"'

    - name: Job summary
      shell: bash
      env:
        REPORT: ${{ steps.gate.outputs.markdown }}
      run: cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

    # Forks get a read-only token, so they get the job summary only.
    - name: Sticky PR comment
      if: >-
        inputs.comment == 'true' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      # A comment that can't be posted must not hide or change the verdict.
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.gate.outputs.markdown }}
      run: '"$GITHUB_ACTION_PATH/action/sticky-comment.sh"'

    # Signing runs before the check is set: a requested signature that fails must fail the job.
    - name: Install cosign
      if: inputs.sign == 'true' && github.event_name == 'push' && steps.gate.outputs.json != ''
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.4

    - name: Sign the report
      id: sign
      if: inputs.sign == 'true'
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REPORT_JSON: ${{ steps.gate.outputs.json }}
      run: '"$GITHUB_ACTION_PATH/action/sign-report.sh"'

    - name: Upload the signed report
      if: steps.sign.outputs.bundle != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.gate.outputs.json }}
          ${{ steps.sign.outputs.bundle }}
        if-no-files-found: error

    - name: Set the check from the exit code
      shell: bash
      env:
        CODE: ${{ steps.gate.outputs.exit-code }}
      run: exit "$CODE"
