<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <title>Rollback Gate: the demo's v1 release, a rename commit on top, and Rollback Gate reporting UNSAFE for it</title>
  <rect width="1200" height="400" fill="#0d1117"/>
  <text x="56" y="84" font-family="Noto Sans" font-size="46" font-weight="700" fill="#e6edf3">Rollback Gate</text>
  <text x="58" y="120" font-family="Noto Sans" font-size="21" fill="#9198a1">Can the last release still run on the database this pull request leaves behind?</text>
  <line x1="56" y1="150" x2="1144" y2="150" stroke="#3d444d" stroke-width="1"/>
  <g font-family="Noto Sans Mono" font-size="18" fill="#e6edf3" xml:space="preserve">
    <text x="56" y="190"><tspan fill="#9198a1">$ </tspan>git log --oneline --graph</text>
    <text x="56" y="216">* <tspan fill="#d29922">3a54e02</tspan> feat: rename name to fullName and add a required phone</text>
    <text x="56" y="242">* <tspan fill="#d29922">18e8b9e</tspan> <tspan fill="#d29922">(</tspan><tspan fill="#3fb950">tag: v1</tspan><tspan fill="#d29922">)</tspan> feat: ship v1 of the lab app (User with name and email)</text>
    <text x="56" y="274"><tspan fill="#9198a1">$ </tspan>node ../rigseal/dist/cli.js --head 3a54e02</text>
    <text x="56" y="300">Rollback Gate: UNSAFE</text>
    <text x="56" y="326">base: v1 (18e8b9e, tag)</text>
    <text x="56" y="352">head: 3a54e02 (3a54e02)</text>
    <text x="56" y="378">3 UNSAFE, 0 RISKY, 2 SAFE notes</text>
  </g>
</svg>
