# Runs this repo's own action (`uses: ./`) on the lab's Prisma folder: on pull requests it comments; on main it signs, then runs the shipped verifier.
# Trigger is `pull_request`: PR code runs with a read-only token on forks and no secrets.
name: Rollback Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  # Keyless signing: the workflow's OIDC token gets a short-lived signing certificate.
  id-token: write

concurrency:
  group: rollback-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: rollback gate (lab)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history and tags: base is the newest release tag reachable from the target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        uses: ./
        with:
          schema: lab/prisma/schema.prisma
          migrations: lab/prisma/migrations
          # Signs on push only; on pull requests the action skips it with a notice.
          sign: "true"

      # Dogfooding the shipped verifier, as a deploy job would run it.
      - name: Verify the signed report
        if: github.event_name == 'push'
        uses: ./verify
        with:
          report: ${{ steps.gate.outputs.report }}
          bundle: ${{ steps.gate.outputs.bundle }}
          workflow: .github/workflows/rollback-gate.yml
          ref: ${{ github.ref }}

      # And it must refuse: a report changed after signing, and a different deploy commit.
      - name: Tamper with the report
        if: github.event_name == 'push'
        env:
          REPORT: ${{ steps.gate.outputs.report }}
        run: jq '.verdict = "SAFE" | .tampered = true' "$REPORT" > "$RUNNER_TEMP/tampered.json"
      - id: tampered
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./verify
        with:
          report: ${{ runner.temp }}/tampered.json
          bundle: ${{ steps.gate.outputs.bundle }}
          workflow: .github/workflows/rollback-gate.yml
          ref: ${{ github.ref }}
      - id: wrong-sha
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./verify
        with:
          report: ${{ steps.gate.outputs.report }}
          bundle: ${{ steps.gate.outputs.bundle }}
          workflow: .github/workflows/rollback-gate.yml
          ref: ${{ github.ref }}
          sha: "0000000000000000000000000000000000000000"
      - name: Both must have been refused
        if: github.event_name == 'push'
        env:
          TAMPERED: ${{ steps.tampered.outcome }}
          WRONG_SHA: ${{ steps.wrong-sha.outcome }}
        run: |
          echo "tampered report: $TAMPERED, wrong deploy commit: $WRONG_SHA"
          test "$TAMPERED" = failure
          test "$WRONG_SHA" = failure
